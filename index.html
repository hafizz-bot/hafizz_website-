            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            color: #ffffff;
            font-size: 30px;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* تأثير الحركة عند إشارة الماوس */
        .icon-btn:hover {
